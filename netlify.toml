# Long-lived caching for immutable static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The chat widget is under active development and keeps a stable filename
# (no content hash), so it must NOT be cached immutably like other JS —
# doing so left visitors' browsers stuck on stale versions after every
# update. Short cache + revalidation instead. This rule is more specific
# than /*.js above, so Netlify applies it in preference for this file.
[[headers]]
  for = "/assets/js/br-chat-widget.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /signature/images/* are static email-signature assets (logos, social
# icons, badges) that never change once published — cache them long-term
# regardless of file type (this also covers the .gif, which /*.png above
# does not).
[[headers]]
  for = "/signature/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Open Knowledge Format bundle (build.py's generate_ai_files()) — plain
# Markdown concept files, served with an explicit content type same as
# llms.txt above rather than falling back to Netlify's default guess.
[[headers]]
  for = "/okf/*"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# Security headers on every response. Deliberately no Cache-Control here —
# it would collide with the immutable asset rules above (Netlify merges
# matching header blocks, and HTML should revalidate on every request anyway).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
