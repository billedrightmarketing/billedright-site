[build]
  publish = "dist"
  # No build command: dist/ is already committed to the repo (regenerated
  # locally via `python build.py` before every push). Netlify just serves
  # it as-is — this avoids depending on a Python runtime being available
  # in Netlify's build image, which may not alias `python` to python3.

# Clean URLs: serve /services/ (folder + index.html) without exposing .html
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

# Long-lived caching for immutable static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The chat widget is under active development and keeps a stable filename
# (no content hash), so it must NOT be cached immutably like other JS —
# doing so left visitors' browsers stuck on stale versions after every
# update. Short cache + revalidation instead. This rule is more specific
# than /*.js above, so Netlify applies it in preference for this file.
[[headers]]
  for = "/assets/js/br-chat-widget.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers on every response. Deliberately no Cache-Control here —
# it would collide with the immutable asset rules above (Netlify merges
# matching header blocks, and HTML should revalidate on every request anyway).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
