[build]
  command = "python3 build.py"
  publish = "dist"

# Clean URLs: serve /services/ (folder + index.html) without exposing .html
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

# Service and specialty pages moved from flat root-level URLs to nested
