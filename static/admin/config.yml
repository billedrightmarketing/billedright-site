backend:
  name: git-gateway
  branch: main

media_folder: assets/blog
public_folder: /assets/blog

collections:
  - name: blog
    label: Blog Posts
    folder: content/blog
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Author, name: author, widget: string, default: Billed Right }
      - { label: Publish Date, name: date, widget: datetime }
      - label: Category
        name: category
        widget: string
        hint: "Use the category exactly as it appears on the old site (e.g. Healthcare Billing, Healthcare Workflow Optimization, Medical Practice Management)."
      - { label: Meta Description, name: meta_description, widget: text, hint: Keep under 160 characters }
      - label: Title Image
        name: title_image
        widget: image
        required: false
      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false
        hint: "Test/unfinished posts only — keeps this post out of llms.txt and the /okf/ AI-readable files. Does not remove it from the live blog."
      - { label: Body, name: body, widget: markdown }
